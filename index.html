  <style>

  <!-- VIDEO PLAYER SCRIPT -->
  <script>
    (function () {
      "use strict";

      const video = document.getElementById("mainVideo");
      const button = document.getElementById("watchButton");
      const progressBar = document.getElementById("progressBar");
      const background = document.getElementById("backgroundImage");
      const errorMessage = document.getElementById("videoError");

      // LOAD CONFIGURATION
      video.src = PAGE_CONFIG.video;
      video.poster = PAGE_CONFIG.poster;
      background.src = PAGE_CONFIG.background;

      function showButton() {
        button.hidden = false;
      }

      function hideButton() {
        button.hidden = true;
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = false;
        showButton();
      }

      function clearError() {
        errorMessage.hidden = true;
      }

      // MUTED AUTOPLAY
      video.play()
        .then(function () {
          hideButton();
          clearError();
        })
        .catch(function () {
          showButton();
        });

      // PLAY OR PAUSE BUTTON
      button.addEventListener("click", function () {
        if (video.paused || video.ended) {
          video.muted = true;

          video.play()
            .then(function () {
              hideButton();
              clearError();
            })
            .catch(function () {
              showError(
                "Unable to play the video. Please try again."
              );
            });
        } else {
          video.pause();
          showButton();
        }
      });

      // TAP VIDEO TO PAUSE OR RESUME
      video.addEventListener("click", function () {
        if (video.paused || video.ended) {
          video.play()
            .then(function () {
              hideButton();
              clearError();
            })
            .catch(function () {
              showButton();
            });
        } else {
          video.pause();
          showButton();
        }
      });

      // VIDEO PLAYING
      video.addEventListener("playing", function () {
        hideButton();
        clearError();
      });

      // VIDEO PAUSED
      video.addEventListener("pause", function () {
        if (!video.ended) {
          showButton();
        }
      });

      // UPDATE PROGRESS BAR
      video.addEventListener("timeupdate", function () {
        if (
          video.duration &&
          Number.isFinite(video.duration)
        ) {
          const percentage =
            (video.currentTime / video.duration) * 100;

          progressBar.style.width = percentage + "%";
        }
      });

      // VIDEO ENDED
      video.addEventListener("ended", function () {
        progressBar.style.width = "0%";
        showButton();
      });

      // VIDEO ERROR
      video.addEventListener("error", function () {
        showError(
          "Video could not be loaded. Please check the video URL or server."
        );

        console.error(
          "Video error:",
          video.error ? video.error.code : "unknown"
        );
      });

    })();
  </script>
